name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc -p . --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        # @vscode/test-electron needs a display; xvfb is preinstalled on ubuntu runners.
        run: xvfb-run -a npm test
