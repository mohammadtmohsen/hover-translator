name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Run JS actions (e.g. softprops/action-gh-release) on Node 24 instead of the
      # deprecated Node 20. Becomes the default after 2026-06-16; harmless to keep.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Optional — add these as repository secrets to auto-publish to the registries.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Type-check
        run: npx tsc -p . --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: xvfb-run -a npm test

      - name: Package .vsix
        run: npx @vscode/vsce package

      - name: Attach .vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath *.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish *.vsix
